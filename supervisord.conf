[supervisord]
nodaemon=true

[inet_http_server]
port=*:9997
username=admin
password=adminpassword

[program:livingroom]
command=python sim_livingroom.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

